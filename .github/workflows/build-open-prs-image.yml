name: Build Open PRs Image

on:
  push:
    branches:
      - codex/build-open-prs-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/claude-relay-service"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/[:upper:]' '-[:lower:]')
          SHORT_SHA=${GITHUB_SHA::12}

          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${SAFE_REF}-${SHORT_SHA}"
            echo "${IMAGE}:build-open-prs-latest"
            echo EOF
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Build branch containing open PRs #1191 and #1192
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image tags
        run: |
          echo "Pushed image tags:"
          echo "${{ steps.meta.outputs.tags }}"
